<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="JetBrains Mono, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowSec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="760" fill="#020617"/>
  <rect width="1100" height="760" fill="url(#grid)"/>

  <!-- Title -->
  <text x="40" y="42" fill="#e2e8f0" font-size="22" font-weight="bold">SHIELD-NHI</text>
  <text x="40" y="62" fill="#94a3b8" font-size="12">Non-Human Identity Governance Agent — Strands Agents SDK + Amazon Bedrock</text>

  <!-- Connectors boundary -->
  <!-- Discovery sources -->
  <!-- AWS IAM -->
  <rect x="40" y="600" width="220" height="90" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="150" y="625" fill="#fbbf24" font-size="12" text-anchor="middle" font-weight="bold">AWS IAM</text>
  <text x="150" y="642" fill="#fbbf24" font-size="9" text-anchor="middle">roles · keys · policies</text>
  <text x="150" y="660" fill="#fbbf24" font-size="8" text-anchor="middle">discovery connector</text>

  <!-- GitHub -->
  <rect x="300" y="600" width="220" height="90" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="410" y="625" fill="#94a3b8" font-size="12" text-anchor="middle" font-weight="bold">GitHub</text>
  <text x="410" y="642" fill="#94a3b8" font-size="9" text-anchor="middle">apps · tokens · secrets</text>
  <text x="410" y="660" fill="#94a3b8" font-size="8" text-anchor="middle">discovery connector</text>

  <!-- Kubernetes -->
  <rect x="560" y="600" width="220" height="90" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="670" y="625" fill="#94a3b8" font-size="12" text-anchor="middle" font-weight="bold">Kubernetes</text>
  <text x="670" y="642" fill="#94a3b8" font-size="9" text-anchor="middle">service accounts · certs</text>
  <text x="670" y="660" fill="#94a3b8" font-size="8" text-anchor="middle">discovery connector</text>

  <!-- NHI Engine -->
  <rect x="380" y="440" width="340" height="80" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="550" y="470" fill="#a78bfa" font-size="12" text-anchor="middle" font-weight="bold">nhi_engine · Risk Engine</text>
  <text x="550" y="490" fill="#a78bfa" font-size="9" text-anchor="middle">score 0-100 · CRITICAL/HIGH/MEDIUM/LOW</text>
  <text x="550" y="504" fill="#a78bfa" font-size="8" text-anchor="middle">leaked · over-priv / unused / expiring / orphaned</text>

  <!-- Strands Agent core -->
  <rect x="300" y="250" width="500" height="130" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="2"/>
  <text x="550" y="278" fill="#22d3ee" font-size="14" text-anchor="middle" font-weight="bold">SHIELD-NHI · Strands Agents Agent</text>

  <!-- tools -->
  <rect x="320" y="295" width="130" height="36" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="385" y="311" fill="#34d399" font-size="10" text-anchor="middle">scan_inventory</text>
  <text x="385" y="325" fill="#34d399" font-size="8" text-anchor="middle">read-only</text>

  <rect x="462" y="295" width="130" height="36" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="527" y="311" fill="#34d399" font-size="10" text-anchor="middle">risk_report</text>
  <text x="527" y="325" fill="#34d399" font-size="8" text-anchor="middle">read-only</text>

  <rect x="604" y="295" width="130" height="36" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="669" y="311" fill="#34d399" font-size="10" text-anchor="middle">get_nhi</text>
  <text x="669" y="325" fill="#34d399" font-size="8" text-anchor="middle">read-only</text>

  <rect x="604" y="340" width="176" height="36" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="692" y="356" fill="#fb7185" font-size="10" text-anchor="middle">remediate</text>
  <text x="692" y="370" fill="#fb7185" font-size="8" text-anchor="middle">DESTRUCTIVE</text>

  <!-- Human approval gate -->
  <rect x="310" y="330" width="280" height="46" rx="8" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="320" y="350" fill="#fb7185" font-size="10" font-weight="bold">▶ Strands InterventionHandler</text>
  <text x="320" y="365" fill="#fb7185" font-size="9">HumanApprovalGate · remediate → Confirm()</text>

  <!-- Bedrock -->
  <rect x="390" y="120" width="320" height="80" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="550" y="148" fill="#fbbf24" font-size="12" text-anchor="middle" font-weight="bold">Amazon Bedrock (Claude)</text>
  <text x="550" y="166" fill="#fbbf24" font-size="9" text-anchor="middle">risk reasoning · natural-language ops</text>
  <text x="550" y="182" fill="#fbbf24" font-size="9">agent surfaces concerns to the operator</text>

  <!-- Operator -->
  <rect x="420" y="40" width="260" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="550" y="62" fill="#22d3ee" font-size="12" text-anchor="middle" font-weight="bold">SOC Operator / Analyst</text>
  <text x="550" y="78" fill="#22d3ee" font-size="8" text-anchor="middle">approves / denies remediations</text>

  <!-- Arrows -->
  <!-- Bedrock -> Agent (dotted, up) -->
  <line x1="550" y1="200" x2="550" y2="250" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Operator -> Agent -->
  <line x1="550" y1="90" x2="550" y2="120" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="200" x2="550" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Agent -> Engine -->
  <line x1="550" y1="380" x2="550" y2="440" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Engine -> connectors -->
  <line x1="470" y1="520" x2="200" y2="600" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="520" x2="410" y2="600" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="520" x2="670" y2="600" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Security flow: remediate gate -->
  <line x1="692" y1="340" x2="550" y2="355" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowSec)"/>

  <!-- Legend -->
  <g transform="translate(40, 710)">
    <text x="0" y="14" fill="#94a3b8" font-size="9">Agent core</text>
    <rect x="0" y="20" width="16" height="10" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="22" y="28" fill="#64748b" font-size="8">Strands Agents</text>

    <text x="0" y="52" fill="#94a3b8" font-size="9">Tools</text>
    <text x="22" y="52" fill="#34d399" font-size="8">read-only</text>
    <text x="90" y="52" fill="#fb7185" font-size="8">destructive</text>

    <text x="160" y="52" fill="#94a3b8" font-size="9">Human gate</text>
    <rect x="160" y="58" width="16" height="10" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="182" y="66" fill="#64748b" font-size="8">intervention</text>

    <text x="300" y="14" fill="#94a3b8" font-size="9">Bedrock</text>
    <rect x="300" y="20" width="16" height="10" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
    <text x="322" y="28" fill="#64748b" font-size="8">Amazon Bedrock</text>

    <text x="430" y="14" fill="#94a3b8" font-size="9">Domain</text>
    <rect x="430" y="20" width="16" height="10" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
    <text x="452" y="28" fill="#64748b" font-size="8">risk engine</text>

    <text x="430" y="52" fill="#94a3b8" font-size="9">Sources</text>
    <rect x="430" y="58" width="16" height="10" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
    <text x="452" y="66" fill="#64748b" font-size="8">AWS / GitHub / K8s</text>
  </g>
</svg>